version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Every dependency is pinned to an exact version (ADR-0007), so a bump PR is
  # the prompt to read the changelog, not something to merge blindly. Updates
  # stay one PR per dependency: there are no `groups` here on purpose. The
  # Expo SDK and its modules go up together in a PR of their own, by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The Expo SDK declares the React and React Native versions it supports,
      # and the versions of the native modules below (bundledNativeModules.json);
      # they go up with the SDK, by hand (ADR-0010).
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      - dependency-name: react-native-keyboard-controller
      - dependency-name: react-native-svg
      - dependency-name: "@shopify/react-native-skia"
    commit-message:
      prefix: chore
      include: scope
